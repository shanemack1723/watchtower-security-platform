services:
  database:
    image: postgres:17-alpine
    container_name: watchtower-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: watchtower
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower-dev-password
    ports:
      - "5432:5432"
    volumes:
      - watchtower-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchtower -d watchtower"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchtower-api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      WATCHTOWER_DATABASE_URL: postgresql+psycopg://watchtower:watchtower-dev-password@database:5432/watchtower
      WATCHTOWER_AGENT_API_KEY: ${WATCHTOWER_AGENT_API_KEY}
      WATCHTOWER_JWT_SECRET: ${WATCHTOWER_JWT_SECRET}
    ports:
      - "8000:8000"

volumes:
  watchtower-postgres-data: